<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - ورشة المحبوب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { text-align: center; color: #fbbf24; margin-bottom: 30px; font-size: 2.2rem; }
        .card { background: #1e293b; border-radius: 16px; padding: 24px; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-bottom: 20px; font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 8px; font-size: 15px; }
        button { padding: 12px 20px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-success { background: #16a34a; }
        .btn-success:hover { background: #15803d; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #0f172a; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #334155; font-size: 14px; }
        th { background: #334155; color: #fbbf24; }
        .wa-action-btn { background: #25D366; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
    </style>
</head>
<body onload="loadAdminData()">

<div class="container">
    <h1><i class="fas fa-cogs"></i> لوحة الإدارة - ورشة المحبوب</h1>

    <!-- قسم إدارة المخزون -->
    <div class="card">
        <h2><i class="fas fa-boxes"></i> إدارة المخزون وقطع الغيار</h2>
        <input type="text" id="p_name" placeholder="اسم القطعة (مثال: كشاف يمين)">
        <select id="p_cat">
            <option value="كشافات">كشافات</option>
            <option value="قطع غيار ميكانيكا">قطع غيار ميكانيكا</option>
            <option value="سمكرة وبديهات">سمكرة وبديهات</option>
            <option value="أخرى">أخرى</option>
        </select>
        <input type="text" id="p_brand" placeholder="ماركة السيارة (مثال: مرسيدس)">
        <input type="text" id="p_model" placeholder="موديل السيارة / سنة الصنع (مثال: 2008)">
        <input type="number" id="p_price" placeholder="السعر (ريال)">
        <input type="number" id="p_stock" placeholder="الكمية المتوفرة في المخزن" value="1">
        <button class="btn-success" onclick="addProduct()"><i class="fas fa-plus"></i> إضافة القطعة للمخزن</button>
        
        <table>
            <thead>
                <tr>
                    <th>القطعة</th>
                    <th>التصنيف</th>
                    <th>الماركة والموديل</th>
                    <th>السعر</th>
                    <th>المخزون</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="admin_products_list"></tbody>
        </table>
    </div>

    <!-- قسم كروت عمل الورشة -->
    <div class="card">
        <h2><i class="fas fa-clipboard-list"></i> طلبات وكروت عمل الورشة</h2>
        <table>
            <thead>
                <tr>
                    <th>العميل</th>
                    <th>رقم الواتساب</th>
                    <th>السيارة</th>
                    <th>المشكلة الوصف</th>
                    <th>الحالة</th>
                    <th>مراسلة / إجراء</th>
                </tr>
            </thead>
            <tbody id="admin_jobs_list"></tbody>
        </table>
    </div>
</div>

<script>
    async function loadAdminData() {
        // تحميل القطع
        const pRes = await fetch('/products/');
        const products = await pRes.json();
        let pHtml = '';
        products.forEach(p => {
            pHtml += `<tr>
                <td>${p.name}</td>
                <td>${p.category}</td>
                <td>${p.car_brand || ''} ${p.car_model || ''}</td>
                <td>${p.price} ريال</td>
                <td>${p.stock}</td>
                <td><button class="btn-danger" onclick="deleteProduct(${p.id})">حذف</button></td>
            </tr>`;
        });
        document.getElementById('admin_products_list').innerHTML = pHtml || '<tr><td colspan="6" style="text-align:center;">لا توجد قطع مضافة</td></tr>';

        // تحميل الطلبات
        const jRes = await fetch('/jobs/');
        const jobs = await jRes.json();
        let jHtml = '';
        jobs.forEach(j => {
            let waButton = j.whatsapp_number ? 
                `<a href="https://wa.me/${j.whatsapp_number}?text=مرحباً%20${encodeURIComponent(j.customer_name)}،%20بخصوص%20سيارتك%20(${encodeURIComponent(j.car_model)}):%20سيارتك%20أصبحت%20جاهزة%20للاستلام%20في%20ورشة%20المحبوب." target="_blank" class="wa-action-btn"><i class="fab fa-whatsapp"></i> إبلاغ جاهزية</a>` 
                : 'بدون رقم';

            jHtml += `<tr>
                <td>${j.customer_name}</td>
                <td>${j.whatsapp_number || 'غير مسجل'}</td>
                <td>${j.car_model}</td>
                <td>${j.issue_description}</td>
                <td><span style="color: ${j.status === 'جاهز' ? '#4ade80' : '#facc15'}">${j.status}</span></td>
                <td>
                    ${waButton}
                    <button class="btn-success" style="padding: 5px 10px; font-size:12px; margin-right:5px;" onclick="updateStatus(${j.id}, 'جاهز')">تم الجاهزية</button>
                </td>
            </tr>`;
        });
        document.getElementById('admin_jobs_list').innerHTML = jHtml || '<tr><td colspan="6" style="text-align:center;">لا توجد طلبات صيانة حالياً</td></tr>';
    }

    async function addProduct() {
        const name = document.getElementById('p_name').value.trim();
        const category = document.getElementById('p_cat').value;
        const car_brand = document.getElementById('p_brand').value.trim();
        const car_model = document.getElementById('p_model').value.trim();
        const price = parseFloat(document.getElementById('p_price').value);
        const stock = parseInt(document.getElementById('p_stock').value) || 0;

        if (!name || isNaN(price)) {
            alert("الرجاء كتابة اسم القطعة والسعر الصحيح.");
            return;
        }

        await fetch('/products/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, category, car_brand, car_model, price, stock })
        });

        document.getElementById('p_name').value = '';
        document.getElementById('p_brand').value = '';
        document.getElementById('p_model').value = '';
        document.getElementById('p_price').value = '';
        loadAdminData();
    }

    async function deleteProduct(id) {
        if(confirm("هل أنت متأكد من حذف هذه القطعة؟")) {
            await fetch(`/products/${id}`, { method: 'DELETE' });
            loadAdminData();
        }
    }

    async function updateStatus(id, status) {
        await fetch(`/jobs/${id}/status?status=${encodeURIComponent(status)}`, { method: 'PUT' });
        loadAdminData();
    }
</script>

</body>
</html>
